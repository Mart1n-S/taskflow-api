<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Connexion</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="page-center">
    <div class="card">
      <h1 class="card-title">TaskFlow</h1>
      <p class="card-subtitle">Connectez-vous pour accéder au test WebSocket.</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Adresse email</label>
          <input id="email" type="email" autocomplete="email" placeholder="alice@taskflow.dev" required>
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
        </div>
        <p id="error-msg" class="error-msg"></p>
        <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
      </form>
    </div>
  </div>

  <script src="js/login.js"></script>

</body>

</html>
